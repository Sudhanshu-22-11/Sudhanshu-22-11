<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title">
<title id="title">Technology orbit and skills</title>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#090b13"/></linearGradient><linearGradient id="edge"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient><radialGradient id="core"><stop stop-color="#22d3ee" stop-opacity=".9"/><stop offset=".45" stop-color="#a78bfa" stop-opacity=".25"/><stop offset="1" stop-color="#0b1020" stop-opacity="0"/></radialGradient><style>.s{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.m{font-family:ui-monospace,monospace;letter-spacing:1px}.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 18s linear infinite}@keyframes orbit{to{transform:rotate(360deg)}}</style></defs>
<rect width="1200" height="390" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="388" rx="23" fill="none" stroke="url(#edge)" stroke-opacity=".65"/>
<g class="s">
