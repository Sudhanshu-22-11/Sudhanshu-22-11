  <g class="orbit" style="animation-duration:30s"><circle cx="0" cy="-112" r="22" fill="#111827" stroke="#f472b6"/><text x="0" y="-108" text-anchor="middle" fill="#f9a8d4" font-size="10" font-weight="700">UI</text></g>
 </g>
 <g transform="translate(560 100)">
  <text x="0" y="0" fill="#c4b5fd" font-size="12" class="m">CORE SKILLS</text>
  <text x="0" y="34" fill="#f8fafc" font-size="17" font-weight="700">Frontend &amp; UI</text>
  <g font-size="12">
   <rect x="0" y="49" width="98" height="32" rx="9" fill="#111827" stroke="#22d3ee" stroke-opacity=".7"/><text x="49" y="69" fill="#a5f3fc" text-anchor="middle">HTML</text>
   <rect x="108" y="49" width="98" height="32" rx="9" fill="#111827" stroke="#22d3ee" stroke-opacity=".7"/><text x="157" y="69" fill="#a5f3fc" text-anchor="middle">CSS</text>
