<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Sudhanshu Kumar Pandey — Creative Frontend Developer</title><desc id="desc">A midnight glass developer banner with neon cyan and violet accents.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101427"/><stop offset="1" stop-color="#090b13"/></linearGradient>
 <linearGradient id="line"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
 <linearGradient id="name" x2="1" y2=".2"><stop stop-color="#f8fafc"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".22"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#94a3b8" opacity=".16"/></pattern>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <style>
 .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px}
 .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
 .pulse{animation:pulse 2.4s ease-in-out infinite}
 .scan{animation:scan 4s ease-in-out infinite}
 .float{animation:float 5s ease-in-out infinite}
 @keyframes pulse{50%{opacity:.35}}
 @keyframes scan{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(180px);opacity:.8}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
 </style>
</defs>
<rect width="1200" height="390" rx="28" fill="url(#bg)"/>
<rect width="1200" height="390" rx="28" fill="url(#dots)"/>
<circle cx="1040" cy="90" r="250" fill="url(#glow)"/>
<circle cx="1000" cy="300" r="170" fill="#a78bfa" opacity=".08" filter="url(#blur)"/>
<rect x="1" y="1" width="1198" height="388" rx="27" fill="none" stroke="url(#line)" stroke-opacity=".7"/>
<path d="M35 75V35H75 M1125 35H1165V75 M35 315V355H75 M1125 355H1165V315" fill="none" stroke="#22d3ee" stroke-width="2"/>
<g class="sans">
