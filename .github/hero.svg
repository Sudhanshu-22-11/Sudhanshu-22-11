 <path d="M111 113 Q111 70 165 68 Q220 70 219 117 L211 168 Q202 202 165 211 Q129 202 119 168Z" fill="#f0bd9a" stroke="#f8c9aa" stroke-width="1.5"/>
 <!-- ears -->
 <ellipse cx="111" cy="151" rx="10" ry="17" fill="#e7ad8d"/><ellipse cx="219" cy="151" rx="10" ry="17" fill="#e7ad8d"/>
 <!-- hair silhouette and spikes -->
 <path d="M109 139 Q93 105 108 73 L88 78 L109 51 L105 28 L133 48 L143 20 L160 43 L183 18 L190 47 L220 34 L213 60 L239 58 L220 86 Q229 111 218 139 L207 112 L196 91 L181 106 L169 79 L153 105 L137 88 L123 118Z" fill="url(#hair)" stroke="#5365a7" stroke-width="2"/>
 <path d="M112 125 Q132 98 151 91 Q143 112 139 127 M164 96 Q183 85 202 98 L211 128" fill="none" stroke="#7187c9" stroke-width="3" stroke-linecap="round"/>
 <!-- eyes and expression -->
 <path d="M126 145 Q140 134 153 145 Q141 158 128 149Z" fill="#f8fafc"/><ellipse cx="141" cy="146" rx="5" ry="7" fill="#22d3ee"/><circle cx="142" cy="145" r="2.5" fill="#0f172a"/>
 <path d="M177 145 Q190 134 204 145 Q191 158 179 149Z" fill="#f8fafc"/><ellipse cx="191" cy="146" rx="5" ry="7" fill="#22d3ee"/><circle cx="192" cy="145" r="2.5" fill="#0f172a"/>
 <path d="M125 132 L153 130 M178 130 L204 132" stroke="#29365a" stroke-width="5" stroke-linecap="round"/>
 <path d="M157 171 Q165 177 174 170" fill="none" stroke="#a9575e" stroke-width="2.5" stroke-linecap="round"/>
 <path d="M145 186 Q165 194 185 185" fill="none" stroke="#d88c83" stroke-width="2"/>
 <!-- fringe accent -->
 <path d="M132 51 L147 72 L162 48 L173 75 L194 46" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" opacity=".9"/>
 <path d="M75 300 L91 284 M254 289 L270 305" stroke="#f472b6" stroke-width="3" stroke-linecap="round"/>
</g>
</svg>