 <circle cx="91" cy="69" r="4" fill="#34d399" class="pulse"/>
 <text x="105" y="74" fill="#a5f3fc" font-size="12" font-weight="600" letter-spacing="1.3">OPEN TO COLLABORATIONS</text>
 <text x="74" y="133" fill="#94a3b8" font-size="20">Hi there, I'm</text>
 <text x="70" y="190" fill="url(#name)" font-size="47" font-weight="800" letter-spacing="-1.6">Sudhanshu Pandey</text>
 <text x="74" y="231" fill="#e2e8f0" font-size="19" font-weight="600">Frontend Developer in the making <tspan fill="#22d3ee">/</tspan> Creative Web Builder</text>
 <text x="74" y="267" fill="#94a3b8" font-size="15">Building responsive interfaces, thoughtful UI, and interactive web experiences.</text>
 <g transform="translate(74 310)">
  <rect width="130" height="34" rx="9" fill="#111827" stroke="#334155"/>
  <text x="14" y="22" fill="#cbd5e1" font-size="12" class="mono">HTML / CSS</text>
  <rect x="142" width="124" height="34" rx="9" fill="#111827" stroke="#334155"/>
  <text x="156" y="22" fill="#cbd5e1" font-size="12" class="mono">UI / UX</text>
  <rect x="278" width="130" height="34" rx="9" fill="#111827" stroke="#334155"/>
  <text x="292" y="22" fill="#cbd5e1" font-size="12" class="mono">WEB CREATIVE</text>
 </g>
</g>
<g transform="translate(850 70)" class="float">
 <rect x="0" y="0" width="275" height="248" rx="20" fill="#0d1220" stroke="#475569" stroke-opacity=".8"/>
 <rect x="1" y="1" width="273" height="38" rx="19" fill="#182033"/>
 <circle cx="20" cy="20" r="4" fill="#f472b6"/><circle cx="35" cy="20" r="4" fill="#fbbf24"/><circle cx="50" cy="20" r="4" fill="#34d399"/>
 <rect x="72" y="11" width="160" height="18" rx="8" fill="#0b1020" stroke="#334155"/>
 <text x="85" y="23" fill="#64748b" font-size="8" class="mono">sudhanshu.dev / home</text>
 <path d="M24 76h90 M24 96h132 M24 116h70 M24 136h118" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity=".8"/>
 <path d="M24 164h140 M24 184h102" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" opacity=".75"/>
 <rect x="184" y="73" width="65" height="90" rx="10" fill="#172033" stroke="url(#line)"/>
 <circle cx="216" cy="101" r="17" fill="#24354b" stroke="#67e8f9" stroke-opacity=".8"/>
 <path d="M192 147q24-34 48 0" fill="#334155"/>
 <text x="183" y="185" fill="#cbd5e1" font-size="9" class="mono">BUILD / ITERATE</text>
 <rect x="24" y="211" width="224" height="4" rx="2" fill="#334155"/>
 <rect x="24" y="211" width="150" height="4" rx="2" fill="url(#line)"/>
 <rect x="2" y="44" width="271" height="2" fill="#22d3ee" opacity=".5" class="scan"/>
</g>
<text x="74" y="373" fill="#64748b" font-size="10" class="mono">PES INSTITUTE OF TECHNOLOGY · SHIVAMOGGA, INDIA</text>
</svg>