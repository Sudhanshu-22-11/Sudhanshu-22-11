<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Sudhanshu Kumar Pandey — Animated Developer Profile</title>
<desc id="desc">Dark neon banner with an anime-inspired boy character on the right and developer introduction on the left.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101427"/><stop offset="1" stop-color="#080b14"/></linearGradient>
 <linearGradient id="edge"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
 <linearGradient id="txt"><stop stop-color="#f8fafc"/><stop offset=".55" stop-color="#67e8f9"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
 <linearGradient id="hair" x2="1" y2="1"><stop stop-color="#263a63"/><stop offset=".5" stop-color="#111827"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
 <linearGradient id="coat" x2="1" y2="1"><stop stop-color="#164e63"/><stop offset="1" stop-color="#312e81"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#94a3b8" opacity=".16"/></pattern>
 <style>
 .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
 .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:2px}
 .float{animation:float 4s ease-in-out infinite}
 .blink{animation:blink 3s ease-in-out infinite}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
 @keyframes blink{0%,46%,52%,100%{opacity:1}49%{opacity:.45}}
 </style>
</defs>
<rect width="1200" height="390" rx="28" fill="url(#bg)"/><rect width="1200" height="390" rx="28" fill="url(#dots)"/>
<circle cx="930" cy="190" r="280" fill="url(#glow)"/>
<rect x="1" y="1" width="1198" height="388" rx="27" fill="none" stroke="url(#edge)" stroke-opacity=".75"/>
<path d="M35 75V35H75 M1125 35H1165V75 M35 315V355H75 M1125 355H1165V315" fill="none" stroke="#22d3ee" stroke-width="2"/>
<g class="sans">
 <rect x="65" y="48" width="220" height="29" rx="14" fill="#22d3ee" fill-opacity=".1" stroke="#22d3ee" stroke-opacity=".55"/>
 <circle cx="83" cy="62" r="4" fill="#34d399" class="blink"/>
 <text x="97" y="67" fill="#a5f3fc" font-size="11" font-weight="600" letter-spacing="1">BUILDING &amp; LEARNING</text>
 <text x="66" y="124" fill="#94a3b8" font-size="20">Hi, I'm</text>
 <text x="64" y="177" fill="url(#txt)" font-size="45" font-weight="800" letter-spacing="-1.5">Sudhanshu Pandey</text>
 <text x="67" y="211" fill="#e2e8f0" font-size="17" font-weight="650">Frontend Developer in the making</text>
 <text x="67" y="244" fill="#a5b4fc" font-size="15">Creative UI  /  Web Animation  /  AI Projects</text>
 <g font-size="12" font-weight="700" letter-spacing="1">
  <rect x="66" y="274" width="112" height="32" rx="9" fill="#111827" stroke="#334155"/><text x="84" y="294" fill="#a5f3fc">HTML / CSS</text>
  <rect x="188" y="274" width="105" height="32" rx="9" fill="#111827" stroke="#334155"/><text x="208" y="294" fill="#c4b5fd">UI / UX</text>
  <rect x="303" y="274" width="142" height="32" rx="9" fill="#111827" stroke="#334155"/><text x="320" y="294" fill="#f9a8d4">AI PROJECTS</text>
 </g>
 <text x="67" y="337" fill="#64748b" font-size="10" class="mono">PES INSTITUTE OF TECHNOLOGY · SHIVAMOGGA, INDIA</text>
</g>
<!-- anime-inspired boy character, drawn as vector artwork -->
<g class="float" transform="translate(810 24)">
 <circle cx="165" cy="165" r="142" fill="#111827" stroke="#22d3ee" stroke-opacity=".45"/>
 <circle cx="165" cy="165" r="124" fill="#0b1223" stroke="#a78bfa" stroke-opacity=".4" stroke-dasharray="4 8"/>
 <!-- shoulders and jacket -->
 <path d="M66 316 Q75 247 115 231 L145 218 L187 218 L218 232 Q258 251 268 316Z" fill="url(#coat)" stroke="#22d3ee" stroke-width="2"/>
 <path d="M143 220 L165 258 L188 220 L203 316 L127 316Z" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
 <path d="M165 258 L165 314" stroke="#22d3ee" stroke-width="2"/>
